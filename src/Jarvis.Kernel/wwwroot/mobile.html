<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06090f">
<title>JARVIS</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --accent: #3ee0ff; --bg: #06090f; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: #dfe9f3; font-family: system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  header { font-size: 13px; letter-spacing: .35em; opacity: .6; }
  #status { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); min-height: 16px; }
  #dialog { flex: 1; width: 100%; max-width: 460px; overflow-y: auto; padding: 18px 4px; }
  .me { color: #9fb4c9; font-style: italic; margin: 10px 0 4px; }
  .jarvis { color: #e8f4ff; font-size: 17px; line-height: 1.45; }
  #talk {
    width: 132px; height: 132px; border-radius: 50%; border: 2px solid var(--accent);
    background: radial-gradient(circle at 50% 35%, rgba(62,224,255,.25), rgba(62,224,255,.05));
    color: var(--accent); font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    touch-action: none; transition: transform .1s, box-shadow .2s;
  }
  #talk.rec { transform: scale(1.12); box-shadow: 0 0 42px rgba(62,224,255,.55); background: rgba(62,224,255,.2); }
  #talk:disabled { opacity: .35; }
  #keybar { display: none; gap: 8px; width: 100%; max-width: 460px; }
  #keybar input { flex: 1; background: #0d1420; border: 1px solid #24344a; color: #dfe9f3; padding: 10px; border-radius: 8px; }
  #keybar button { background: var(--accent); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; }
</style>
</head>
<body>
  <header>J A R V I S</header>
  <div id="status">connecting…</div>
  <div id="dialog"></div>
  <div id="keybar">
    <input id="key-input" placeholder="paste your X-Jarvis-Key" autocomplete="off">
    <button id="key-save">Save</button>
  </div>
  <button id="talk" disabled>Hold to talk</button>
  <script src="mobile.js"></script>
</body>
</html>
