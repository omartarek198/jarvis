<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — The Council</title>
<style>
  /* The Council — nine lenses, one decision. Matches console.css tokens. */
  :root {
    --bg: #06090f;
    --panel: rgba(10, 17, 26, 0.82);
    --line: rgba(110, 200, 255, 0.10);
    --accent: #3ee0ff;
    --txt: #d6e4ee;
    --dim: #5d7387;
    --faint: #34465a;
    --amber: #ffd35d;
    --red: #ff5d6c;
    --violet: #9d6bff;
    --green: #3ce6a0;
    --mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
    --disp: "Chakra Petch", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font: 13px/1.5 var(--mono);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 22px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 {
    font-family: var(--disp); font-size: 14px; font-weight: 600;
    letter-spacing: 0.42em; color: var(--txt);
    text-shadow: 0 0 18px color-mix(in oklab, var(--accent) 50%, transparent);
  }
  .brand h1::before { content: "◆"; color: var(--accent); font-size: 9px; margin-right: 12px; vertical-align: 2px; }
  .brand .sub { font-size: 10px; letter-spacing: 0.22em; color: var(--dim); }
  #conn { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
  #conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background 0.4s, box-shadow 0.4s; }
  #conn.live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #conn.poll .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  /* ---------- decision banner ---------- */
  #banner { text-align: center; padding: 14px 22px 10px; flex: 0 0 auto; }
  #framed {
    font-family: var(--disp); font-size: 17px; font-weight: 600;
    color: var(--txt); letter-spacing: 0.04em; text-wrap: balance;
    max-width: 880px; margin: 0 auto 8px;
  }
  #framed:empty::before { content: "NO COUNCIL IN SESSION"; color: var(--faint); letter-spacing: 0.3em; font-size: 12px; }
  .badges { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .badge {
    font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
    padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
  }
  .badge.mode { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
  .badge.cat { color: var(--violet); border-color: color-mix(in oklab, var(--violet) 45%, transparent); }
  .badge[hidden] { display: none; }
  #status-line {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim);
  }
  #status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background 0.4s, box-shadow 0.4s; }
  #status-line.busy #status-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  #status-line.wait #status-dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  #status-line.done #status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* context fact chips */
  #facts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  #facts[hidden] { display: none; }
  .fact {
    font-size: 9.5px; letter-spacing: 0.06em; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    background: rgba(110, 200, 255, 0.04); max-width: 340px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default;
  }
  .fact b { color: var(--accent); font-weight: 600; }

  /* return-to-live chip */
  #live-chip {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent); background: transparent; cursor: pointer;
    border: 1px solid color-mix(in oklab, var(--accent) 45%, transparent);
    border-radius: 999px; padding: 4px 14px;
    box-shadow: 0 0 14px color-mix(in oklab, var(--accent) 14%, transparent);
  }
  #live-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  #live-chip:hover { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  #live-chip[hidden] { display: none; }

  /* idle / empty state */
  #idle-hint { margin-top: 14px; }
  #idle-hint[hidden] { display: none; }
  #idle-hint p { font-size: 11px; color: var(--dim); letter-spacing: 0.06em; margin-bottom: 10px; }
  #idle-hint .examples { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ex-chip {
    font-family: var(--mono); font-size: 10px; color: var(--accent);
    background: transparent; border: 1px dashed color-mix(in oklab, var(--accent) 35%, transparent);
    border-radius: 999px; padding: 5px 14px; cursor: pointer; transition: background 0.2s, box-shadow 0.2s;
  }
  .ex-chip:hover { background: color-mix(in oklab, var(--accent) 10%, transparent); box-shadow: 0 0 12px color-mix(in oklab, var(--accent) 18%, transparent); }

  /* ---------- main ---------- */
  main { flex: 1 1 auto; display: grid; grid-template-columns: auto 1fr 380px; gap: 0; min-height: 0; }

  /* session history rail */
  #history {
    width: 236px; border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0; transition: width 0.25s ease;
  }
  #history.collapsed { width: 36px; }
  #history .hhead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  #history .hhead h2 {
    font-family: var(--disp); font-size: 10px; font-weight: 600; letter-spacing: 0.3em;
    color: var(--dim); text-transform: uppercase; white-space: nowrap; overflow: hidden;
  }
  #history.collapsed .hhead h2 { display: none; }
  #hist-toggle {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    font-family: var(--mono); font-size: 12px; padding: 0 2px; line-height: 1;
  }
  #hist-toggle:hover { color: var(--accent); }
  #hist-list { flex: 1 1 auto; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  #history.collapsed #hist-list { display: none; }
  #hist-list .hempty { padding: 14px 12px; font-size: 10px; color: var(--faint); letter-spacing: 0.08em; }
  .hrow {
    padding: 9px 12px; border-bottom: 1px solid rgba(110, 200, 255, 0.05);
    cursor: pointer; transition: background 0.2s;
  }
  .hrow:hover { background: rgba(110, 200, 255, 0.05); }
  .hrow.sel { background: rgba(110, 200, 255, 0.08); box-shadow: inset 2px 0 0 var(--accent); }
  .hrow .hmeta { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .hrow .hdot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
  .hrow .hdot.decided { background: var(--green); }
  .hrow .hdot.cancelled { background: var(--dim); }
  .hrow .hdot.discarded { background: var(--faint); opacity: 0.5; }
  .hrow .hdot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .hrow .hdate { font-size: 9px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap; }
  .hrow .hmode {
    font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
    border-radius: 999px; padding: 1px 7px;
  }
  .hrow .hdec { font-size: 10.5px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* agent grid */
  #agents {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 8px 22px 16px; overflow-y: auto; align-content: start;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
  }
  .agent {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px; position: relative;
    transition: opacity 0.4s, border-color 0.3s, box-shadow 0.3s;
  }
  .agent.off { opacity: 0.28; }
  .agent.speaking {
    border-color: color-mix(in oklab, var(--accent) 55%, transparent);
    box-shadow: 0 0 24px color-mix(in oklab, var(--accent) 22%, transparent),
                inset 0 0 18px color-mix(in oklab, var(--accent) 8%, transparent);
  }
  .agent.vetoed { animation: veto-flash 0.9s ease-in-out 3; border-color: var(--red); }
  @keyframes veto-flash {
    0%, 100% { box-shadow: 0 0 0 rgba(255, 93, 108, 0); }
    50% { box-shadow: 0 0 28px rgba(255, 93, 108, 0.55); border-color: var(--red); }
  }
  .agent .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .agent .name { font-family: var(--disp); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
  .agent .key { font-size: 9px; letter-spacing: 0.2em; color: var(--faint); text-transform: uppercase; }
  .agent.speaking .name { color: var(--accent); }
  .eq { display: none; align-items: flex-end; gap: 2px; height: 10px; position: absolute; top: 13px; right: 14px; }
  .agent.speaking .eq { display: inline-flex; }
  .agent.speaking .key { visibility: hidden; }
  .eq i { width: 2px; background: var(--accent); animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 50%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: 0.15s; }
  .eq i:nth-child(3) { height: 70%; animation-delay: 0.3s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
  .pill {
    display: inline-block; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 2px 10px; border-radius: 999px; border: 1px solid var(--faint); color: var(--faint);
    margin-bottom: 8px;
  }
  .pill.now        { color: var(--green);  border-color: color-mix(in oklab, var(--green) 50%, transparent); }
  .pill.later      { color: var(--amber);  border-color: color-mix(in oklab, var(--amber) 50%, transparent); }
  .pill.reject     { color: var(--red);    border-color: color-mix(in oklab, var(--red) 50%, transparent); }
  .pill.compromise { color: var(--violet); border-color: color-mix(in oklab, var(--violet) 50%, transparent); }
  .pill.ask_more   { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 50%, transparent); }
  .conf { height: 3px; background: rgba(110, 200, 255, 0.08); border-radius: 2px; overflow: hidden; }
  .conf i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.6s ease, background 0.6s; }
  .conf-lbl { font-size: 9px; color: var(--faint); letter-spacing: 0.14em; margin-top: 5px; min-height: 14px; }
  .agent.has-vote { cursor: pointer; }
  .vdetail {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 10.5px; line-height: 1.5; animation: line-in 0.25s ease;
  }
  .vdetail[hidden] { display: none; }
  .vdetail .vrow { margin-bottom: 4px; overflow-wrap: anywhere; }
  .vdetail .vrow:last-child { margin-bottom: 0; }
  .vdetail .vlbl {
    font-size: 8.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--faint); display: block;
  }
  .vdetail .vrow.risk .vlbl { color: color-mix(in oklab, var(--red) 70%, var(--faint)); }
  .vdetail .vrow.act .vlbl { color: color-mix(in oklab, var(--green) 60%, var(--faint)); }

  /* transcript */
  #transcript-panel {
    border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0; backdrop-filter: blur(10px);
  }
  #transcript-panel > h2 {
    font-family: var(--disp); font-size: 10px; font-weight: 600; letter-spacing: 0.3em;
    color: var(--dim); text-transform: uppercase;
    padding: 13px 18px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  #transcript { flex: 1 1 auto; overflow-y: auto; padding: 8px 0; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  .line { padding: 8px 18px; border-bottom: 1px solid rgba(110, 200, 255, 0.04); animation: line-in 0.3s ease; }
  @keyframes line-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  .line .who { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
  .line .who .phase { color: var(--faint); letter-spacing: 0.12em; margin-left: 8px; }
  .line .txt { font-size: 11.5px; line-height: 1.55; color: var(--txt); overflow-wrap: anywhere; }
  .line.jarvis .who { color: var(--accent); }
  .line.user .who { color: var(--amber); }
  .line.agent .who { color: var(--violet); }
  .line.jarvis .txt { color: #b9cde0; }
  #transcript .empty { padding: 18px; color: var(--faint); font-size: 11px; letter-spacing: 0.1em; }

  /* ---------- bottom bar ---------- */
  footer { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(12px); }
  #verdict { padding: 12px 22px 0; display: none; }
  #verdict.show { display: block; }
  #verdict .rec { font-family: var(--disp); font-size: 14px; color: var(--green); margin-bottom: 4px; text-wrap: pretty; }
  #verdict .rec::before { content: "▶ "; color: var(--accent); }
  #verdict .meta { font-size: 10px; letter-spacing: 0.12em; color: var(--dim); }
  #verdict .meta .veto { color: var(--red); font-weight: 700; letter-spacing: 0.2em; margin-right: 10px; }
  #verdict .meta .dissent { color: var(--amber); }
  .controls { display: flex; align-items: center; gap: 10px; padding: 12px 22px 14px; flex-wrap: wrap; }
  .controls button {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    background: transparent; color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
    padding: 8px 16px; border-radius: 2px; cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, opacity 0.3s;
  }
  .controls button:hover { background: color-mix(in oklab, var(--accent) 12%, transparent); box-shadow: 0 0 14px color-mix(in oklab, var(--accent) 22%, transparent); }
  .controls button:active { transform: scale(0.97); }
  .controls button.danger { color: var(--red); border-color: color-mix(in oklab, var(--red) 40%, transparent); }
  .controls button.danger:hover { background: color-mix(in oklab, var(--red) 10%, transparent); box-shadow: 0 0 14px color-mix(in oklab, var(--red) 25%, transparent); }
  .controls button.ghost { color: var(--dim); border-color: var(--faint); }
  .controls button.ghost:hover { background: rgba(110, 200, 255, 0.05); box-shadow: none; color: var(--txt); }
  .controls button:disabled { opacity: 0.3; cursor: default; box-shadow: none; background: transparent; }
  #cmd-bar {
    flex: 1; min-width: 240px; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 3px; padding: 8px 14px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #cmd-bar:focus-within { border-color: color-mix(in oklab, var(--accent) 45%, transparent); box-shadow: 0 0 22px color-mix(in oklab, var(--accent) 12%, transparent); }
  #cmd-bar.wait { border-color: color-mix(in oklab, var(--amber) 45%, transparent); box-shadow: 0 0 22px color-mix(in oklab, var(--amber) 14%, transparent); }
  #cmd-bar .prompt { color: var(--accent); font-weight: 700; }
  #cmd-mode { font-size: 9px; letter-spacing: 0.2em; color: var(--faint); white-space: nowrap; text-transform: uppercase; }
  #cmd-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--txt); font-family: var(--mono); font-size: 13px; caret-color: var(--accent);
  }
  #cmd-input::placeholder { color: var(--faint); }
  #cmd-send {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    background: transparent; color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
    padding: 5px 14px; border-radius: 2px; cursor: pointer;
  }
  #cmd-send:hover { background: color-mix(in oklab, var(--accent) 12%, transparent); }

  @media (max-width: 1100px) { #agents { grid-template-columns: repeat(2, 1fr); } main { grid-template-columns: auto 1fr 320px; } #history { width: 200px; } #history.collapsed { width: 36px; } }
  @media (max-width: 820px)  { main { grid-template-columns: 1fr; } #transcript-panel, #history { display: none; } }
</style>
</head>
<body>

<header>
  <div class="brand"><h1>THE COUNCIL</h1><span class="sub">NINE LENSES · ONE DECISION</span></div>
  <div id="conn"><span class="dot"></span><span id="conn-lbl">CONNECTING</span></div>
</header>

<div id="banner">
  <div id="framed"></div>
  <div class="badges">
    <span class="badge mode" id="badge-mode" hidden></span>
    <span class="badge cat" id="badge-cat" hidden></span>
  </div>
  <div id="facts" hidden></div>
  <div id="status-line"><span id="status-dot"></span><span id="status-txt">IDLE</span></div>
  <div><button id="live-chip" hidden>Return to live</button></div>
  <div id="idle-hint" hidden>
    <p>Convene the nine lenses on any decision — frame it below or try one of these:</p>
    <div class="examples">
      <button class="ex-chip">quick council: gym or ship the release</button>
      <button class="ex-chip">war council: ship feature X?</button>
      <button class="ex-chip">quick council: hire a contractor or do it myself</button>
    </div>
  </div>
</div>

<main>
  <aside id="history">
    <div class="hhead"><h2>Sessions</h2><button id="hist-toggle" title="Collapse history">‹</button></div>
    <div id="hist-list"><div class="hempty">Loading…</div></div>
  </aside>
  <div id="agents"></div>
  <aside id="transcript-panel">
    <h2>Transcript</h2>
    <div id="transcript"><div class="empty">No turns yet.</div></div>
  </aside>
</main>

<footer>
  <div id="verdict">
    <div class="rec" id="verdict-rec"></div>
    <div class="meta"><span class="veto" id="verdict-veto" hidden>VETO</span><span id="verdict-tally"></span> <span class="dissent" id="verdict-dissent"></span></div>
  </div>
  <div class="controls">
    <button id="btn-confirm">Confirm task</button>
    <button id="btn-claude">Send to Claude</button>
    <button id="btn-reject" class="danger">Reject decision</button>
    <button id="btn-nosave" class="ghost">Don't save</button>
    <button id="btn-stop" class="danger">Stop council</button>
    <div id="cmd-bar">
      <span class="prompt">›</span>
      <span id="cmd-mode">CONVENE</span>
      <input id="cmd-input" autocomplete="off" spellcheck="false" placeholder="frame a decision for the council…">
      <button id="cmd-send">SEND</button>
    </div>
  </div>
</footer>

<script src="vendor/signalr.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- the nine lenses ---------- */
  var AGENTS = [
    { key: "ceo",      name: "CEO" },
    { key: "cto",      name: "CTO" },
    { key: "operator", name: "Operator" },
    { key: "investor", name: "Investor" },
    { key: "health",   name: "Health Coach" },
    { key: "skeptic",  name: "Skeptic" },
    { key: "future",   name: "Future You" },
    { key: "customer", name: "Customer Voice" },
    { key: "sales",    name: "Sales" },
  ];
  var NAME_BY_KEY = {};
  AGENTS.forEach(function (a) { NAME_BY_KEY[a.key] = a.name; });

  var state = {
    sessionId: null,
    status: "idle",        // idle | active | decided | cancelled | discarded
    hubConnected: false,
    lastTranscriptKey: "", // dedupe guard between live events and poll rehydrate
    liveSessionId: null,   // the currently-active session, even while browsing history
    viewingHistorical: false,
    votes: {},             // agentKey → vote row (reason / risk / action / weight)
  };

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ---------- agent cards ---------- */
  function buildCards() {
    el("agents").innerHTML = AGENTS.map(function (a) {
      return '<div class="agent off" data-key="' + a.key + '">' +
        '<div class="head"><span class="name">' + esc(a.name) + '</span><span class="key">' + a.key + '</span>' +
        '<span class="eq"><i></i><i></i><i></i></span></div>' +
        '<span class="pill">—</span>' +
        '<div class="conf"><i></i></div>' +
        '<div class="conf-lbl"></div>' +
        '<div class="vdetail" hidden></div>' +
        '</div>';
    }).join("");
  }

  function card(key) { return document.querySelector('.agent[data-key="' + key + '"]'); }

  function setRoster(keys) {
    document.querySelectorAll(".agent").forEach(function (c) {
      c.classList.toggle("off", keys.indexOf(c.dataset.key) === -1);
    });
  }

  function resetCards() {
    state.votes = {};
    document.querySelectorAll(".agent").forEach(function (c) {
      c.classList.remove("speaking", "vetoed", "has-vote");
      c.querySelector(".pill").className = "pill";
      c.querySelector(".pill").textContent = "—";
      c.querySelector(".conf i").style.width = "0%";
      c.querySelector(".conf-lbl").textContent = "";
      var d = c.querySelector(".vdetail");
      d.hidden = true; d.innerHTML = "";
    });
  }

  /* ---------- vote detail (click a voted card to expand) ---------- */
  function storeVote(v) {
    if (!v || !v.agentKey) return;
    state.votes[v.agentKey] = Object.assign(state.votes[v.agentKey] || {}, v);
    var c = card(v.agentKey);
    if (c) c.classList.add("has-vote");
  }

  function voteDetailHtml(v) {
    function row(cls, lbl, val) {
      return '<div class="vrow ' + cls + '"><span class="vlbl">' + lbl + '</span>' + esc(val || "—") + '</div>';
    }
    var w = (v.weight == null || isNaN(v.weight)) ? "—" : (+v.weight).toFixed(1);
    return row("", "Reason", v.reason) +
      row("risk", "Primary risk", v.primaryRisk) +
      row("act", "Recommended action", v.recommendedAction) +
      '<div class="vrow"><span class="vlbl">Weight</span>' + w + '</div>';
  }

  el("agents").addEventListener("click", function (e) {
    var c = e.target.closest ? e.target.closest(".agent") : null;
    if (!c) return;
    var v = state.votes[c.dataset.key];
    if (!v) return;
    var d = c.querySelector(".vdetail");
    if (d.hidden) { d.innerHTML = voteDetailHtml(v); d.hidden = false; }
    else { d.hidden = true; }
  });

  function setPosition(key, position, confidence, vetoed) {
    var c = card(key);
    if (!c) return;
    if (position) {
      var pill = c.querySelector(".pill");
      pill.className = "pill " + position;
      pill.textContent = position.replace("_", " ");
    }
    if (confidence != null && !isNaN(confidence)) {
      var pct = Math.max(0, Math.min(100, +confidence));
      var bar = c.querySelector(".conf i");
      bar.style.width = pct + "%";
      bar.style.background = pct >= 70 ? "var(--green)" : pct >= 40 ? "var(--accent)" : "var(--amber)";
      c.querySelector(".conf-lbl").textContent = "confidence " + pct + "%";
    }
    if (vetoed) {
      c.classList.remove("vetoed");
      void c.offsetWidth; // restart the flash animation
      c.classList.add("vetoed");
    }
  }

  function setSpeaking(key, on) {
    var c = card(key);
    if (c) c.classList.toggle("speaking", !!on);
    if (on) document.querySelectorAll(".agent.speaking").forEach(function (o) {
      if (o !== c) o.classList.remove("speaking");
    });
  }

  /* ---------- banner / status ---------- */
  function setHeaderFromSession(s) {
    el("framed").textContent = s.framedDecision || "";
    setBadge("badge-mode", s.mode);
    setBadge("badge-cat", s.category);
    renderFacts(s.contextFactsJson);
  }

  /* ---------- context fact chips ---------- */
  function renderFacts(json) {
    var box = el("facts");
    var facts = null;
    try { facts = json ? JSON.parse(json) : null; } catch (e) { facts = null; }
    var keys = facts ? Object.keys(facts) : [];
    if (!keys.length) { box.hidden = true; box.innerHTML = ""; return; }
    box.innerHTML = keys.map(function (k) {
      var raw = facts[k];
      var val = typeof raw === "string" ? raw : JSON.stringify(raw);
      var short = val.length > 60 ? val.slice(0, 60) + "…" : val;
      return '<span class="fact" title="' + esc(k + ": " + val) + '"><b>' + esc(k) + ':</b> ' + esc(short) + '</span>';
    }).join("");
    box.hidden = false;
  }
  function setBadge(id, val) {
    var b = el(id);
    if (val) { b.textContent = val; b.hidden = false; } else { b.hidden = true; }
  }
  function setStatus(text, cls) {
    el("status-txt").textContent = text;
    el("status-line").className = cls || "";
  }

  /* ---------- transcript ---------- */
  function lineHtml(speaker, phase, text) {
    var cls = speaker === "jarvis" ? "jarvis" : speaker === "user" ? "user" : "agent";
    var who = speaker === "jarvis" ? "JARVIS · MODERATOR"
            : speaker === "user" ? "YOU"
            : (NAME_BY_KEY[speaker] || speaker).toUpperCase();
    return '<div class="line ' + cls + '">' +
      '<div class="who">' + esc(who) + (phase ? '<span class="phase">' + esc(phase) + '</span>' : "") + '</div>' +
      '<div class="txt">' + esc(text) + '</div></div>';
  }

  function addLine(speaker, phase, text) {
    if (!text) return;
    var key = speaker + "|" + text;
    if (key === state.lastTranscriptKey) return;
    state.lastTranscriptKey = key;
    var t = el("transcript");
    var empty = t.querySelector(".empty");
    if (empty) empty.remove();
    t.insertAdjacentHTML("beforeend", lineHtml(speaker, phase, text));
    t.scrollTop = t.scrollHeight;
  }

  function renderTranscript(turns) {
    var t = el("transcript");
    if (!turns || !turns.length) {
      t.innerHTML = '<div class="empty">No turns yet.</div>';
      state.lastTranscriptKey = "";
      return;
    }
    t.innerHTML = turns.map(function (x) { return lineHtml(x.speaker, x.phase, x.text); }).join("");
    var last = turns[turns.length - 1];
    state.lastTranscriptKey = last.speaker + "|" + last.text;
    t.scrollTop = t.scrollHeight;
  }

  /* ---------- verdict bar ---------- */
  function showVerdict(recommendation, tally, dissent, veto) {
    if (!recommendation) { el("verdict").classList.remove("show"); return; }
    el("verdict").classList.add("show");
    el("verdict-rec").textContent = recommendation;
    el("verdict-veto").hidden = !veto;
    var parts = [];
    if (tally) {
      Object.keys(tally)
        .sort(function (a, b) { return tally[b] - tally[a]; })
        .forEach(function (k) { parts.push(k.replace("_", " ") + " " + (+tally[k]).toFixed(1)); });
    }
    el("verdict-tally").textContent = parts.length ? "weighted tally: " + parts.join(" · ") : "";
    el("verdict-dissent").textContent = dissent ? "dissent — " + dissent : "";
  }

  /* ---------- command input mode ---------- */
  function setInputMode() {
    var active = state.status === "active";
    el("cmd-mode").textContent = active ? "ANSWER" : "CONVENE";
    el("cmd-input").placeholder = active
      ? "answer the council / give input…"
      : "frame a decision for the council…";
    var buttons = ["btn-confirm", "btn-claude", "btn-reject", "btn-nosave", "btn-stop"];
    buttons.forEach(function (id) { el(id).disabled = !active; });
  }

  /* ---------- REST ---------- */
  function post(text) {
    return fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, source: "ui" }),
    }).catch(function (err) {
      addLine("jarvis", "error", "Kernel unreachable: " + err.message);
    });
  }

  function hydrate(id) {
    return fetch("/api/council/sessions/" + encodeURIComponent(id))
      .then(function (r) { if (!r.ok) throw new Error("session fetch " + r.status); return r.json(); })
      .then(function (d) {
        var s = d.session;
        state.sessionId = s.id;
        state.status = s.status;
        if (s.status === "active") {
          state.liveSessionId = s.id;
          state.viewingHistorical = false;
        } else if (state.liveSessionId === s.id) {
          state.liveSessionId = null;
          state.viewingHistorical = false;
        } else {
          state.viewingHistorical = !!state.liveSessionId;
        }
        el("idle-hint").hidden = true;
        setHeaderFromSession(s);
        resetCards();
        var roster = (s.agentKeysCsv || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean);
        if (!roster.length && d.votes) roster = d.votes.map(function (v) { return v.agentKey; });
        setRoster(roster.length ? roster : []);
        (d.votes || []).forEach(function (v) {
          storeVote(v);
          setPosition(v.agentKey, v.position, v.confidence, v.vetoed);
        });
        renderTranscript(d.turns || []);
        if (s.status === "active") {
          setStatus("COUNCIL IN SESSION", "busy");
          showVerdict(null);
        } else {
          var tally = null;
          try { tally = s.resultJson ? JSON.parse(s.resultJson) : null; } catch (e) { tally = null; }
          if (tally && !Object.keys(tally).length) tally = null;
          var vetoFired = (d.votes || []).some(function (v) { return v.vetoed; });
          if (s.status === "decided") {
            setStatus("DECIDED — READ ONLY", "done");
            showVerdict(s.finalRecommendation, tally, s.dissentSummary, vetoFired);
          } else {
            setStatus((s.status || "closed").toUpperCase() + " — READ ONLY", "");
            showVerdict(s.finalRecommendation || null, tally, s.dissentSummary, vetoFired);
          }
        }
        setInputMode();
        updateLiveChip();
        markHistorySel();
      });
  }

  /* ---------- session history rail ---------- */
  function shortDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function renderHistory(list) {
    var box = el("hist-list");
    if (!list || !list.length) {
      box.innerHTML = '<div class="hempty">No sessions yet.</div>';
      return;
    }
    box.innerHTML = list.map(function (s) {
      var st = (s.status || "").toLowerCase();
      var dec = s.framedDecision || s.finalRecommendation || "(unframed)";
      return '<div class="hrow" data-id="' + esc(s.id) + '" title="' + esc(dec) + '">' +
        '<div class="hmeta"><span class="hdot ' + esc(st) + '"></span>' +
        '<span class="hdate">' + esc(shortDate(s.createdAt)) + '</span>' +
        (s.mode ? '<span class="hmode">' + esc(s.mode) + '</span>' : "") + '</div>' +
        '<div class="hdec">' + esc(dec) + '</div></div>';
    }).join("");
    markHistorySel();
  }

  function markHistorySel() {
    document.querySelectorAll("#hist-list .hrow").forEach(function (r) {
      r.classList.toggle("sel", r.dataset.id === state.sessionId);
    });
  }

  function loadHistory() {
    return fetch("/api/council/sessions?take=15")
      .then(function (r) { if (!r.ok) throw new Error("sessions fetch " + r.status); return r.json(); })
      .then(function (list) { renderHistory(list || []); return list || []; });
  }

  function updateLiveChip() {
    el("live-chip").hidden = !(state.viewingHistorical && state.liveSessionId);
  }

  el("hist-list").addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".hrow") : null;
    if (!row || !row.dataset.id || row.dataset.id === state.sessionId) return;
    hydrate(row.dataset.id).catch(function (err) { console.warn("history load:", err.message); });
  });

  el("hist-toggle").addEventListener("click", function () {
    var h = el("history");
    var collapsed = h.classList.toggle("collapsed");
    el("hist-toggle").textContent = collapsed ? "›" : "‹";
    el("hist-toggle").title = collapsed ? "Expand history" : "Collapse history";
  });

  el("live-chip").addEventListener("click", function () {
    if (!state.liveSessionId) { updateLiveChip(); return; }
    hydrate(state.liveSessionId).catch(function () {});
  });

  function boot() {
    loadHistory()
      .then(function (list) {
        if (!list.length) {
          setStatus("NO SESSIONS YET — CONVENE BELOW", "");
          el("idle-hint").hidden = false;
          setInputMode();
          return;
        }
        var active = list.filter(function (s) { return s.status === "active"; })[0];
        if (active) state.liveSessionId = active.id;
        return hydrate((active || list[0]).id);
      })
      .catch(function (err) {
        console.warn("council boot:", err.message);
        setStatus("KERNEL UNREACHABLE", "");
        el("hist-list").innerHTML = '<div class="hempty">Unavailable.</div>';
        setInputMode();
      });
  }

  /* ---------- SignalR (with poll fallback) ---------- */
  function onEvent(e) {
    var kind = e && e.kind || "";
    if (kind.indexOf("council.") !== 0) return;
    var p = e.payload || {};

    // a different session started while we were viewing an old one — follow the live one
    if (kind === "council.started") {
      state.sessionId = p.sessionId;
      state.liveSessionId = p.sessionId;
      state.status = "active";
      state.viewingHistorical = false;
      el("idle-hint").hidden = true;
      updateLiveChip();
      el("framed").textContent = p.framedDecision || "";
      setBadge("badge-mode", p.mode);
      setBadge("badge-cat", p.category);
      renderFacts(null);
      resetCards();
      renderTranscript([]);
      showVerdict(null);
      var roster = (p.agents || []).map(function (a) { return a.key; });
      setRoster(roster);
      setStatus("COUNCIL CONVENED", "busy");
      if (p.spoken) addLine("jarvis", "framing", p.spoken);
      setInputMode();
      loadHistory().catch(function () {});
      return;
    }

    // the live session closed — even if we're browsing history, the rail and chip must follow
    if (kind === "council.saved" || kind === "council.cancelled") {
      loadHistory().catch(function () {});
      if (!p.sessionId || p.sessionId === state.liveSessionId) {
        state.liveSessionId = null;
        state.viewingHistorical = false;
        updateLiveChip();
      }
    }

    if (p.sessionId && state.sessionId && p.sessionId !== state.sessionId) return;

    switch (kind) {
      case "council.question.asked":
        setStatus("QUESTION ASKED — ANSWER BELOW", "wait");
        el("cmd-bar").classList.add("wait");
        addLine("jarvis", "clarify", p.question || p.spoken);
        break;

      case "council.user.input.requested":
        setStatus("WAITING FOR YOU", "wait");
        el("cmd-bar").classList.add("wait");
        addLine("jarvis", "input", p.prompt || p.spoken);
        break;

      case "council.deliberation.started":
        setStatus("DELIBERATING", "busy");
        el("cmd-bar").classList.remove("wait");
        break;

      case "council.agent.speaking.started":
        setStatus((p.displayName || NAME_BY_KEY[p.agentKey] || p.agentKey || "AGENT").toUpperCase() + " SPEAKING", "busy");
        el("cmd-bar").classList.remove("wait");
        setSpeaking(p.agentKey, true);
        if (p.position || p.confidence != null) setPosition(p.agentKey, p.position, p.confidence, false);
        addLine(p.agentKey, p.phase || "statement", p.spoken);
        break;

      case "council.agent.speaking.ended":
        setSpeaking(p.agentKey, false);
        break;

      case "council.vote.started":
        setStatus("VOTING", "busy");
        break;

      case "council.vote.cast":
        storeVote({ agentKey: p.agentKey, position: p.position, confidence: p.confidence });
        setPosition(p.agentKey, p.position, p.confidence, false);
        break;

      case "council.decision.ready":
        setStatus("DECISION READY", "done");
        document.querySelectorAll(".agent.speaking").forEach(function (c) { c.classList.remove("speaking"); });
        showVerdict(p.recommendation, p.tally, p.dissent, p.veto);
        if (p.spoken) addLine("jarvis", "decision", p.spoken);
        if (state.sessionId) {
          // pull the vote rows: full reason/risk/action for card detail, and flash any veto
          fetch("/api/council/sessions/" + encodeURIComponent(state.sessionId))
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
              if (!d) return;
              (d.votes || []).forEach(function (v) {
                storeVote(v);
                if (v.vetoed) setPosition(v.agentKey, v.position, v.confidence, true);
              });
            })
            .catch(function () {});
        }
        break;

      case "council.action.created":
        addLine("jarvis", "action", "Action created: " + (p.kind || "?") + (p.title ? ' — "' + p.title + '"' : "") + (p.refId ? " [" + p.refId + "]" : ""));
        break;

      case "council.saved":
        state.status = "decided";
        setStatus("SESSION SAVED", "done");
        el("cmd-bar").classList.remove("wait");
        setInputMode();
        break;

      case "council.cancelled":
        state.status = "cancelled";
        setStatus("COUNCIL DISMISSED", "");
        el("cmd-bar").classList.remove("wait");
        document.querySelectorAll(".agent.speaking").forEach(function (c) { c.classList.remove("speaking"); });
        setInputMode();
        break;

      case "council.error":
        addLine("jarvis", "error", p.message || "council error");
        break;
    }
  }

  function connectHub() {
    if (typeof signalR === "undefined") {
      console.warn("signalR lib missing — polling only");
      setConn("poll", "POLLING");
      return;
    }
    try {
      var connection = new signalR.HubConnectionBuilder()
        .withUrl("/ws")
        .withAutomaticReconnect()
        .build();
      connection.on("event", function (raw) {
        try { onEvent(raw || {}); } catch (err) { console.error("council event handler:", err); }
      });
      connection.onreconnected(function () {
        state.hubConnected = true;
        setConn("live", "LIVE");
        if (state.sessionId) hydrate(state.sessionId).catch(function () {});
      });
      connection.onclose(function () { state.hubConnected = false; setConn("poll", "POLLING"); });
      connection.onreconnecting(function () { state.hubConnected = false; setConn("poll", "RECONNECTING"); });
      connection.start()
        .then(function () { state.hubConnected = true; setConn("live", "LIVE"); })
        .catch(function (err) {
          state.hubConnected = false;
          setConn("poll", "POLLING");
          console.warn("hub connect failed — polling fallback:", err && err.message);
        });
    } catch (err) {
      setConn("poll", "POLLING");
      console.warn("hub init failed:", err && err.message);
    }
  }

  function setConn(cls, label) {
    el("conn").className = cls;
    el("conn-lbl").textContent = label;
  }

  // Poll fallback: while a session is active and the hub is down, rehydrate every 5s.
  // Also catches sessions started elsewhere (voice) when the hub never connected.
  setInterval(function () {
    if (state.hubConnected) return;
    if (state.viewingHistorical) return; // don't yank the user out of a history view
    if (state.sessionId && state.status === "active") {
      hydrate(state.sessionId).catch(function () {});
    } else {
      fetch("/api/council/sessions?take=5")
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          var active = (list || []).filter(function (s) { return s.status === "active"; })[0];
          if (active && active.id !== state.sessionId) return hydrate(active.id);
          if (active && state.status !== "active") return hydrate(active.id);
        })
        .catch(function () {});
    }
  }, 5000);

  /* ---------- controls ---------- */
  el("btn-confirm").addEventListener("click", function () { post("confirm"); });
  el("btn-claude").addEventListener("click", function () { post("send to claude"); });
  el("btn-reject").addEventListener("click", function () { post("reject decision"); });
  el("btn-nosave").addEventListener("click", function () { post("don't save this"); });
  el("btn-stop").addEventListener("click", function () { post("stop council"); });

  function sendInput() {
    var input = el("cmd-input");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    el("cmd-bar").classList.remove("wait");
    if (state.status === "active" && !state.viewingHistorical) {
      addLine("user", "input", text);
      post(text);
    } else {
      // example chips / typed phrases may already carry the council verb — don't double-prefix
      var framed = /^(quick |full |war |emergency )?(council|convene)\b/i.test(text);
      post(framed ? text : "quick council: " + text);
      setStatus("CONVENING…", "busy");
    }
  }
  el("cmd-send").addEventListener("click", sendInput);
  el("cmd-input").addEventListener("keydown", function (e) { if (e.key === "Enter") sendInput(); });

  /* idle-state example chips fill the convene input */
  document.querySelectorAll(".ex-chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      el("cmd-input").value = chip.textContent;
      el("cmd-input").focus();
    });
  });

  /* ---------- go ---------- */
  buildCards();
  setInputMode();
  boot();
  connectHub();
})();
</script>
</body>
</html>
